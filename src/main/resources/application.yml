spring:
  application:
    name: ai-chat-demo-2
  profiles:
    default: local
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jooq:
    sql-dialect: postgres
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:}
      chat:
        model: ${AI_MODEL:}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: 12h
  chat:
    model-history: 40
    title-max: 120
    message-max: 16000
    page-size: 20
    max-page-size: 100

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
